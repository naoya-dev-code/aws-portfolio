name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::699475953900:role/GitHubActions-S3-Deploy
          aws-region: ap-northeast-1

      - name: Deploy to S3
        run: aws s3 sync . s3://portfolio-naoya-s3 --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md" --exclude "terraform/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E2K6JUZRDJP734 --paths "/*"
